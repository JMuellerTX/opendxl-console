name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
      fail-fast: false

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install broker
      run: |
        docker pull opendxl/opendxl-broker
        docker run -d -p 8883:8883 -p 8443:8443 opendxl/opendxl-broker
        docker ps -a

    - name: Install dependencies
      run: |
        pip install wheel
        # The PyPI release of the OpenDXL Python client pins msgpack<1.0 (vulnerable)
        # and does not work on current Python versions; install the fixed fork first
        pip install "git+https://github.com/derjochenmueller/opendxl-client-python@epo-legacy"
        # ... and the fixed dxlbootstrap, which no longer imports pkg_resources
        # (gone from setuptools >= 82)
        pip install "dxlbootstrap @ git+https://github.com/derjochenmueller/opendxl-bootstrap-python@master"
        pip install .[test]

    - name: Provision client
      run: |
        # The throwaway broker signs its management certificate itself; the fork's client
        # validates it by default, so this one run has to opt out.
        python -m dxlclient provisionconfig sample localhost client -u admin -p password --insecure
        cat sample/dxlclient.config

    - name: Execute CI
      run: |
        python -m pylint dxlconsole/modules *.py dxlconsole/*.py
        python -m pytest
